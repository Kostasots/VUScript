<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>VU Review Log</title>
<style>
  :root{
    --bg-deep:#0B1F2E;
    --bg-panel:#12293C;
    --bg-panel-2:#1B3A52;
    --bg-panel-3:#0F2434;
    --text-primary:#F4F7FA;
    --text-muted:#8FA6B8;
    --text-dim:#5D7A8E;
    --accent-green:#3FA34D;
    --accent-green-dim:#20401f;
    --accent-amber:#E8A33D;
    --accent-amber-dim:#3d2e12;
    --accent-red:#D6455A;
    --accent-red-dim:#3a1620;
    --accent-yellow:#E8D93D;
    --accent-yellow-dim:#3d3a12;
    --accent-blue:#4C8FD1;
    --accent-blue-dim:#152d42;
    --border:#24445E;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-deep);
    color:var(--text-primary);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:900px; margin:0 auto; padding:18px 16px 60px;}

  /* Header */
  .header{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px; padding-bottom:14px; border-bottom:2px solid var(--border);
  }
  .header h1{
    font-size:20px; margin:0; letter-spacing:0.14em; text-transform:uppercase;
    font-weight:800; font-stretch:condensed;
  }
  .header .sub{color:var(--text-muted); font-size:12px; letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;}
  .header-icon{font-size:22px;}

  /* Panels */
  .panel{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:14px;
  }
  .panel-title{
    font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted);
    font-weight:700; margin:0 0 12px 0; display:flex; align-items:center; gap:8px;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .scope-toggle{display:flex; gap:8px; margin-bottom:14px;}
  .scope-btn{
    flex:1; text-align:center; padding:10px 8px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg-panel-3); color:var(--text-muted); font-size:13px; font-weight:800;
    text-transform:uppercase; letter-spacing:0.04em; cursor:pointer;
  }
  .scope-btn.selected{border-color:var(--accent-blue); background:var(--accent-blue-dim); color:#EAF3FC;}
  .scope-toggle-sm{margin-bottom:8px;}
  .scope-toggle-sm .scope-btn{padding:7px 6px; font-size:11px;}
  .drilldown-select{margin-bottom:8px; display:block;}
  .drilldown-note{font-size:12px; color:var(--text-muted); font-style:italic; margin-bottom:8px;}
  .field-hint{font-size:11px; color:var(--text-dim); margin-top:5px;}
  .discretion-toggle{
    display:flex; align-items:center; gap:10px; margin-top:14px; padding:10px 12px;
    background:var(--bg-panel-3); border:1px solid var(--border); border-radius:10px; cursor:pointer;
  }
  .discretion-checkbox{
    flex-shrink:0; width:22px; height:22px; border-radius:5px; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:#F3E98F;
  }
  .discretion-checkbox.checked{border-color:var(--accent-yellow); background:var(--accent-yellow-dim);}
  .discretion-label{font-size:13px; color:var(--text-primary); font-weight:600;}
  .field{flex:1; min-width:140px;}
  .field label{display:block; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:5px;}
  select, input[type=text], input[type=email], textarea{
    width:100%; background:var(--bg-panel-3); border:1px solid var(--border); color:var(--text-primary);
    padding:11px 10px; border-radius:9px; font-size:16px; font-family:inherit;
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--accent-blue); outline-offset:1px;}
  textarea{resize:vertical; min-height:44px;}

  .btn{
    border:none; border-radius:10px; padding:12px 16px; font-size:15px; font-weight:700;
    cursor:pointer; color:var(--text-primary); text-align:center; letter-spacing:0.02em;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-height:46px;
  }
  .btn:active{transform:scale(0.98);}
  .btn-blue{background:var(--accent-blue);}
  .btn-ghost{background:var(--bg-panel-2); color:var(--text-primary); border:1px solid var(--border);}
  .btn-green{background:var(--accent-green);}
  .btn-red{background:var(--accent-red);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  /* New referral launcher */
  .new-referral-btn{
    width:100%; background:linear-gradient(135deg, var(--accent-blue), #2f6aa8);
    border:none; border-radius:var(--radius); color:#fff; padding:18px;
    font-size:16px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase;
    cursor:pointer; margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .new-referral-btn:active{transform:scale(0.99);}

  /* Wizard */
  .wizard-overlay{
    position:fixed; inset:0; background:rgba(4,12,18,0.88); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media(min-width:640px){ .wizard-overlay{align-items:center;} }
  .wizard{
    background:var(--bg-panel); width:100%; max-width:640px; max-height:94vh; overflow-y:auto;
    border-radius:20px 20px 0 0; border:1px solid var(--border); border-bottom:none;
    display:flex; flex-direction:column;
  }
  @media(min-width:640px){ .wizard{border-radius:20px; border-bottom:1px solid var(--border);} }

  .wizard-rail{
    display:flex; gap:6px; padding:16px 16px 0 16px;
  }
  .rail-step{
    flex:1; height:5px; border-radius:3px; background:var(--border);
  }
  .rail-step.done{background:var(--accent-blue);}
  .rail-step.active{background:var(--accent-amber);}

  .wizard-body{padding:20px;}
  .step-eyebrow{
    font-size:11px; color:var(--accent-amber); text-transform:uppercase; letter-spacing:0.14em;
    font-weight:800; margin-bottom:6px;
  }
  .step-script{
    font-style:italic; color:var(--text-muted); font-size:15px; margin:0 0 18px 0;
    padding:10px 14px; background:var(--bg-panel-3); border-left:3px solid var(--accent-amber);
    border-radius:0 8px 8px 0;
  }
  .script-readout{
    background:var(--accent-blue-dim); border:2px solid var(--accent-blue); border-radius:12px;
    padding:20px 18px; font-size:20px; line-height:1.55; font-weight:700; color:#EAF3FC;
    font-style:italic;
  }
  .entry-script{
    margin-top:9px; padding:9px 11px; background:var(--bg-panel-3); border-left:3px solid var(--accent-blue);
    border-radius:0 8px 8px 0; font-size:13px; font-style:italic; color:#B9D3EA;
  }
  .choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .choice-grid.single{grid-template-columns:1fr;}
  .choice-btn{
    background:var(--bg-panel-3); border:2px solid var(--border); border-radius:12px;
    padding:16px 12px; color:var(--text-primary); font-size:15px; font-weight:700;
    cursor:pointer; text-align:center; min-height:56px;
    display:flex; align-items:center; justify-content:center;
  }
  .choice-btn:active{transform:scale(0.98);}
  .choice-btn.selected{border-color:var(--accent-blue); background:var(--accent-blue-dim);}
  .choice-btn.opt-green.selected{border-color:var(--accent-green); background:var(--accent-green-dim); color:#8FE39B;}
  .choice-btn.opt-amber.selected{border-color:var(--accent-amber); background:var(--accent-amber-dim); color:#F5C87A;}
  .choice-btn.opt-red.selected{border-color:var(--accent-red); background:var(--accent-red-dim); color:#F19AA8;}
  .choice-btn.opt-yellow.selected{border-color:var(--accent-yellow); background:var(--accent-yellow-dim); color:#F3E98F;}
  .choice-btn.choice-disabled{opacity:0.4; cursor:not-allowed; border-style:dashed;}
  .disabled-tag{font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent-red); font-weight:800;}

  .wizard-footer{
    display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--border);
    position:sticky; bottom:0; background:var(--bg-panel);
  }

  /* Log entries */
  .entry{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:12px;
    padding:14px; margin-bottom:10px;
  }
  .entry-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .entry-badge{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
    padding:4px 9px; border-radius:20px; white-space:nowrap;
  }
  .badge-home{background:var(--accent-blue-dim); color:#9CC4EA;}
  .badge-umpire{background:var(--bg-panel-2); color:var(--text-muted);}
  .entry-title{font-weight:700; font-size:15px; margin:0 0 4px 0;}
  .entry-detail{color:var(--text-muted); font-size:13px; line-height:1.5;}
  .entry-outcome{
    display:inline-block; margin-top:8px; font-size:12px; font-weight:800; padding:3px 9px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.04em;
  }
  .outcome-green{background:var(--accent-green-dim); color:#8FE39B;}
  .outcome-amber{background:var(--accent-amber-dim); color:#F5C87A;}
  .outcome-red{background:var(--accent-red-dim); color:#F19AA8;}
  .entry-delete{background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer; padding:4px 6px;}

  .empty-state{
    text-align:center; padding:36px 20px; color:var(--text-dim); font-size:14px;
  }

  .settings-toggle{
    background:none; border:none; color:var(--text-muted); font-size:12px; text-transform:uppercase;
    letter-spacing:0.08em; cursor:pointer; padding:6px 0; display:flex; align-items:center; gap:6px;
  }

  .footer-actions{display:flex; gap:10px; margin-top:16px;}
  .footer-actions .btn{flex:1;}
  .footer-brand{display:flex; flex-direction:column; align-items:center; gap:4px; margin-top:22px; opacity:0.35;}
  .footer-brand img{height:22px; width:auto;}
  .footer-version{font-size:10px; letter-spacing:0.06em; color:var(--text-muted); text-transform:uppercase;}

  .team-manage-row{display:flex; gap:8px; margin-top:8px;}
  .team-manage-row input{flex:1;}
  .chip-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .chip{
    background:var(--bg-panel-3); border:1px solid var(--border); border-radius:20px;
    padding:5px 10px; font-size:12px; display:flex; align-items:center; gap:6px; color:var(--text-muted);
  }
  .chip button{background:none; border:none; color:var(--accent-red); cursor:pointer; font-size:13px; padding:0;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--accent-green); color:#062009; font-weight:700; font-size:13px;
    padding:10px 18px; border-radius:20px; z-index:100; box-shadow:0 4px 20px rgba(0,0,0,0.4);
  }
</style>
</head>

  const STORAGE_KEY = 'vu-settings';

  async function loadSettings(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        state.settings = Object.assign({supervisorEmail:"", customTeams:[]}, parsed);
      }
    }catch(e){ /* no saved settings yet */ }
    render();
  }

  async function saveSettings(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state.settings), false);
    }catch(e){ console.error('settings save failed', e); }
  }

  function esc(s){
    return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ---------- Rendering ----------
  const app = document.getElementById('app');

  function render(){
    app.innerHTML = `
      ${header()}
      ${gameInfoPanel()}
      ${state.game.home || state.game.away ? newReferralButton() : ''}
      ${settingsPanel()}
      ${logSection()}
      ${state.entries.length ? footerActions() : ''}
      ${footerBrand()}
      ${state.wizard ? wizardOverlay() : ''}
    `;
    attachHandlers();
  }

  function header(){
    return `
      <div class="header">
        <div>
          <h1>VU Review Log</h1>
          <div class="sub">Video Umpire &middot; Referral Tracking</div>
        </div>
        <div class="header-icon">&#127946;</div>
      </div>
    `;
  }

  function settingsPanel(){
    return `
      <div class="panel">
        <button class="settings-toggle" data-action="toggle-settings">
          ${state.settingsOpen ? '&#9660;' : '&#9654;'} Roster &amp; Supervisor Settings
        </button>
        ${state.settingsOpen ? `
          <div style="margin-top:12px;">
            <div class="field">
              <label>Supervisor / Umpire Manager Email(s)</label>
              <input type="email" multiple id="supervisorEmail" placeholder="name@example.com, name2@example.com" value="${esc(state.settings.supervisorEmail)}">
              <div class="field-hint">Separate multiple addresses with a comma &mdash; useful when a PAHF/FIH event has more than one UM.</div>
            </div>
            <div class="field" style="margin-top:12px;">
              <label>Add Tournament / Custom Team</label>
              <div class="team-manage-row">
                <input type="text" id="customTeamInput" placeholder="e.g. Argentina, Club XYZ">
                <button class="btn btn-blue" data-action="add-team" style="min-height:44px; padding:10px 16px;">Add</button>
              </div>
              ${state.settings.customTeams.length ? `
                <div class="chip-list">
                  ${state.settings.customTeams.map((t,i)=>`
                    <div class="chip">${esc(t)} <button data-action="remove-team" data-index="${i}">&times;</button></div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }

  function pahfOptions(selected){
    let opts = `<option value="">Select team&hellip;</option>`;
    PAHF_TEAMS.forEach(t => opts += `<option value="${esc(t)}" ${t===selected?'selected':''}>${esc(t)}</option>`);
    if(state.settings.customTeams.length){
      opts += `<optgroup label="Tournament / Custom">`;
      state.settings.customTeams.forEach(t => opts += `<option value="${esc(t)}" ${t===selected?'selected':''}>${esc(t)}</option>`);
      opts += `</optgroup>`;
    }
    return opts;
  }

  function divisionOptions(selected){
    let opts = `<option value="">Select division&hellip;</option>`;
    NCAA_DIVISIONS.forEach(d => opts += `<option value="${d.key}" ${d.key===selected?'selected':''}>${esc(d.label)}</option>`);
    return opts;
  }

  function conferenceOptions(division, selected){
    const conferences = Object.keys(NCAA_ROSTERS[division] || {});
    let opts = `<option value="">Select conference&hellip;</option>`;
    conferences.forEach(c => opts += `<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`);
    return opts;
  }

  function ncaaTeamOptions(division, conference, selected){
    const teams = (NCAA_ROSTERS[division] && NCAA_ROSTERS[division][conference]) || [];
    let opts = `<option value="">Select team&hellip;</option>`;
    teams.forEach(t => opts += `<option value="${esc(t)}" ${t===selected?'selected':''}>${esc(t)}</option>`);
    if(state.settings.customTeams.length){
      opts += `<optgroup label="Tournament / Custom">`;
      state.settings.customTeams.forEach(t => opts += `<option value="${esc(t)}" ${t===selected?'selected':''}>${esc(t)}</option>`);
      opts += `</optgroup>`;
    }
    return opts;
  }

  function teamFieldHTML(side){
    const val = state.game[side];
    const scope = state.game[side+'Scope'];

    if(scope === 'other'){
      return `<input type="text" id="${side}TeamText" placeholder="Team name" value="${esc(val)}">`;
    }

    if(scope === 'pahf'){
      return `<select id="${side}Team">${pahfOptions(val)}</select>`;
    }

    // scope === 'ncaa': Division -> Conference -> Team drill-down
    const division = state.game[side+'Division'];
    const conference = state.game[side+'Conference'];
    let html = `<select id="${side}Division" class="drilldown-select" data-side="${side}">${divisionOptions(division)}</select>`;

    if(division === 'd3' && Object.keys(NCAA_ROSTERS.d3).length === 0){

  // ---------- Wizard ----------
  function newWizardData(){
    return { type:'', referrer:'', quarter:'', clockTime:'', question:'', onFieldDecision:'', vuFinding:'', decision:'', restart:'', restartOther:'', penalty:'none', discretionPenalty:false, discretionPenaltyNumber:'', keepLose:'', tookAdvice:null };
  }

  function wizardSteps(data){
    // Steps depend on whether it's a team or umpire referral
    const steps = ['type'];
    if(data.type === 'team'){
      steps.push('when','question','onfield','vufinding','decision','restart','keeplose','script');
    } else if(data.type === 'umpire'){
      steps.push('when','situation','vufinding','decision','restart');
      if(data.question === 'Serious Misconduct'){
        steps.push('penalty');
      }
      steps.push('script');
    }
    return steps;
  }

  function buildScript(data){
    const decisionPhrase = {
      no_change: "There's no clear reason to change your decision.",
      advice: "I have advice for you.",
      no_advice: "No advice is possible."
    }[data.decision] || '';

    const parts = [decisionPhrase];

    if(data.vuFinding){
      let finding = data.vuFinding.trim();
      const words = finding.split(/\s+/).filter(Boolean);
      const looksLikeSentence = /^(there|the|no|yes|it|he|she|they|on|off|during|after|before|when|i\s|we\s)\b/i.test(finding);
      if(words.length > 0 && words.length <= 3 && !looksLikeSentence){
        const article = /^[aeiou]/i.test(words[0]) ? 'an' : 'a';
        finding = `There was ${article} ${finding.charAt(0).toLowerCase()}${finding.slice(1)}`;
      }
      parts.push(finding.replace(/\.?$/, '.'));
    }

    if(data.penalty === 'yellow'){
      parts.push(`Yellow card, ten minutes.`);
    } else if(data.penalty === 'red'){
      parts.push(`Red card.`);
    }

    if(data.restart){
      if(data.discretionPenalty){
        const restartClause = data.restart === 'Goal' ? 'you may restart at midfield with a free push' : `you may restart with a ${data.restart}`;
        const numberPart = data.discretionPenaltyNumber ? ` to player #${data.discretionPenaltyNumber}` : '';
        const sentence = `${restartClause}, and award a personal penalty${numberPart}.`;
        parts.push(sentence.charAt(0).toUpperCase() + sentence.slice(1));
        parts.push(`It is the on-field umpire's discretion as to whether it is a green, yellow (5 or 10 minute), or red card.`);
      } else {
        const restartPhrase = data.restart === 'Goal' ? 'at midfield with a free push' : `a ${data.restart}`;
        parts.push(`Restart is ${restartPhrase}.`);
      }
    }

    if(data.type === 'team'){
      const teamName = data.referrer === 'home' ? (state.game.home || 'Home') : (state.game.away || 'Away');
      parts.push(`${teamName} ${data.keepLose === 'keep' ? 'KEEP' : 'LOSE'} their referral.`);
    }

    return parts.filter(Boolean).join(' ');
  }

  function wizardOverlay(){
    const w = state.wizard;
    const steps = wizardSteps(w.data);
    const stepKey = steps[w.step];
    const total = steps.length;

    return `
      <div class="wizard-overlay" data-action="overlay-bg">
        <div class="wizard" onclick="event.stopPropagation()">
          <div class="wizard-rail">
            ${steps.map((s,i)=>`<div class="rail-step ${i<w.step?'done':i===w.step?'active':''}"></div>`).join('')}
          </div>
          <div class="wizard-body">
            ${wizardStepContent(stepKey, w.data, w.step, total)}
          </div>
          <div class="wizard-footer">
            ${w.step > 0 ? `<button class="btn btn-ghost" data-action="wizard-back">Back</button>` : `<button class="btn btn-ghost" data-action="wizard-cancel">Cancel</button>`}
            <button class="btn btn-blue btn-block" data-action="wizard-next" ${canAdvance(stepKey,w.data)?'':'disabled'}>
              ${w.step === total-1 ? 'Confirm & Save' : 'Next'}
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function canAdvance(stepKey, data){
    switch(stepKey){
      case 'type': return !!data.type;
      case 'when': return !!data.quarter;
      case 'question': return true;
      case 'situation': return !!data.question;
      case 'onfield': return true;
      case 'decision': return !!data.decision;
      case 'restart': return !!data.restart;
      case 'penalty': return true;
      case 'keeplose': return !!data.keepLose;
      case 'script': return true;
      default: return true;
    }
  }

  // ---------- Event handling ----------
  function attachHandlers(){
    app.querySelectorAll('[data-action]').forEach(el=>{
      el.addEventListener('click', onAction);
    });
    const supEmail = document.getElementById('supervisorEmail');
    if(supEmail) supEmail.addEventListener('change', e=>{ state.settings.supervisorEmail = e.target.value; saveSettings(); });

    const customInput = document.getElementById('customTeamInput');
    if(customInput) customInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ addCustomTeam(); }});

    const homeSel = document.getElementById('homeTeam');
    if(homeSel) homeSel.addEventListener('change', e=>{ state.game.home = e.target.value; state.game.referralStatus.home = false; render(); });
    const awaySel = document.getElementById('awayTeam');
    if(awaySel) awaySel.addEventListener('change', e=>{ state.game.away = e.target.value; state.game.referralStatus.away = false; render(); });
    const homeText = document.getElementById('homeTeamText');
    if(homeText) homeText.addEventListener('input', e=>{ state.game.home = e.target.value; });
    const awayText = document.getElementById('awayTeamText');
    if(awayText) awayText.addEventListener('input', e=>{ state.game.away = e.target.value; });
    ['home','away'].forEach(side=>{
      const divSel = document.getElementById(side+'Division');
      if(divSel) divSel.addEventListener('change', e=>{
        state.game[side+'Division'] = e.target.value;
        state.game[side+'Conference'] = '';
        state.game[side] = '';
        state.game.referralStatus[side] = false;
        render();
      });
      const confSel = document.getElementById(side+'Conference');
      if(confSel) confSel.addEventListener('change', e=>{
        state.game[side+'Conference'] = e.target.value;
        state.game[side] = '';
        state.game.referralStatus[side] = false;
        render();
      });
    });
    const labelInput = document.getElementById('gameLabel');
    if(labelInput) labelInput.addEventListener('change', e=>{ state.game.label = e.target.value; });
    const dateInput = document.getElementById('gameDate');
    if(dateInput) dateInput.addEventListener('change', e=>{ state.game.date = e.target.value; });

    const wzQuestion = document.getElementById('wz-question');
    if(wzQuestion) wzQuestion.addEventListener('input', e=>{ state.wizard.data.question = e.target.value; });
    const wzOnfield = document.getElementById('wz-onfield');
    if(wzOnfield) wzOnfield.addEventListener('input', e=>{ state.wizard.data.onFieldDecision = e.target.value; });
    const wzVuFinding = document.getElementById('wz-vufinding');
    if(wzVuFinding) wzVuFinding.addEventListener('input', e=>{ state.wizard.data.vuFinding = e.target.value; });
    const wzRestartOther = document.getElementById('wz-restart-other');
    if(wzRestartOther) wzRestartOther.addEventListener('input', e=>{ state.wizard.data.restartOther = e.target.value; });
    const wzDiscretionNumber = document.getElementById('wz-discretion-number');
    if(wzDiscretionNumber) wzDiscretionNumber.addEventListener('input', e=>{
      const digits = e.target.value.replace(/[^0-9]/g,'');
      if(digits !== e.target.value) e.target.value = digits;
      state.wizard.data.discretionPenaltyNumber = digits;
    });
    const wzClockTime = document.getElementById('wz-clocktime');
    if(wzClockTime) wzClockTime.addEventListener('input', e=>{
      const digits = e.target.value.replace(/[^0-9]/g,'').slice(0,4);
      const formatted = digits.length > 2 ? digits.slice(0, digits.length-2) + ':' + digits.slice(-2) : digits;
      e.target.value = formatted;
      state.wizard.data.clockTime = formatted;
    });
  }

  function addCustomTeam(){
    const input = document.getElementById('customTeamInput');
    const val = input.value.trim();
    if(!val) return;
    state.settings.customTeams.push(val);
    saveSettings();
    input.value = '';
    render();
  }

  function onAction(e){
    const el = e.currentTarget;
    const action = el.dataset.action;

    if(action === 'set-scope'){
      const side = el.dataset.side;
      const val = el.dataset.value;
      const scopeKey = side + 'Scope';
      if(state.game[scopeKey] !== val){
        state.game[scopeKey] = val;
        state.game[side] = '';
        state.game[side+'Division'] = '';
        state.game[side+'Conference'] = '';
        state.game.referralStatus[side] = false;
      }
      render(); return;
    }
    if(action === 'reset-shootout'){
      if(confirm('Shootout reached: give each team one referral for the shootout, regardless of regulation status?')){
        state.game.referralStatus = { home:false, away:false };
        render();
      }
      return;
    }
    if(action === 'toggle-settings'){ state.settingsOpen = !state.settingsOpen; render(); return; }
    if(action === 'add-team'){ addCustomTeam(); return; }
    if(action === 'remove-team'){
      const idx = parseInt(el.dataset.index,10);
      state.settings.customTeams.splice(idx,1);
      saveSettings(); render(); return;
    }
    if(action === 'start-wizard'){
      state.wizard = { step:0, data:newWizardData() };
      render(); return;
    }
    if(action === 'overlay-bg'){
      // clicking backdrop cancels
      state.wizard = null; render(); return;
    }
    if(action === 'wizard-cancel'){ state.wizard = null; render(); return; }
    if(action === 'wizard-back'){
      state.wizard.step = Math.max(0, state.wizard.step - 1);
      render(); return;
    }
    if(action === 'set-referrer'){
      state.wizard.data.referrer = el.dataset.value;
      state.wizard.data.type = 'team';
      render(); return;
    }
    if(action === 'set-type-umpire'){
      state.wizard.data.type = 'umpire';
      state.wizard.data.referrer = '';
      render(); return;
    }
    if(action === 'set-situation'){ state.wizard.data.question = el.dataset.value; render(); return; }
    if(action === 'set-quarter'){ state.wizard.data.quarter = el.dataset.value; render(); return; }
    if(action === 'set-decision'){ state.wizard.data.decision = el.dataset.value; render(); return; }
    if(action === 'set-restart'){ state.wizard.data.restart = el.dataset.value; render(); return; }
    if(action === 'toggle-discretion-penalty'){
      state.wizard.data.discretionPenalty = !state.wizard.data.discretionPenalty;
      if(!state.wizard.data.discretionPenalty){ state.wizard.data.discretionPenaltyNumber = ''; }
      render(); return;
    }
    if(action === 'set-penalty'){ state.wizard.data.penalty = el.dataset.value; render(); return; }
    if(action === 'set-keeplose'){ state.wizard.data.keepLose = el.dataset.value; render(); return; }
    if(action === 'set-took-advice'){ state.wizard.data.tookAdvice = (el.dataset.value === 'yes'); render(); return; }

    if(action === 'wizard-next'){
      const steps = wizardSteps(state.wizard.data);
      const isLast = state.wizard.step === steps.length - 1;
      if(isLast){
        finalizeEntry();
      } else {
        state.wizard.step += 1;
        render();
      }
      return;
    }

    if(action === 'delete-entry'){
      const idx = parseInt(el.dataset.index,10);
      state.entries.splice(idx,1);
      render(); return;
    }
    if(action === 'clear-log'){
      if(confirm('Clear all logged referrals for this game?')){
        state.entries = [];
        state.game.referralStatus = { home:false, away:false };
        render();
      }
      return;
    }
    if(action === 'email-log'){ emailLog(); return; }
  }

  function finalizeEntry(){
    const d = state.wizard.data;
    if(d.restart === 'Other' && d.restartOther){ d.restart = d.restartOther; }
    if(d.type === 'team' && d.keepLose === 'lose' && d.referrer){
      state.game.referralStatus[d.referrer] = true;
    }
    const scriptText = buildScript(d);
    state.entries.push(Object.assign({}, d, { scriptText, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) }));
    state.wizard = null;
    render();
  }

  function emailLog(){
    if(!state.settings.supervisorEmail){
      state.settingsOpen = true;
      render();
      alert('Add the supervisor / umpire manager email in Settings first.');
      return;
    }
    const home = state.game.home || 'Home';
    const away = state.game.away || 'Away';
    const subject = `VU Log: ${home} vs ${away} - ${state.game.date}`;
    let body = `Video Umpire Referral Log\n`;
    body += `${home} vs ${away}\n`;
    if(state.game.label) body += `${state.game.label}\n`;
    body += `Date: ${state.game.date}\n`;
    body += `\n----------------------------\n\n`;

    if(!state.entries.length){
      body += `No referrals logged.\n`;
    } else {
      state.entries.forEach((e, i)=>{
        const who = e.type==='umpire' ? 'Umpire Referral' : `${e.referrer==='home'?home:away} Referral`;
        const outcome = DECISION_OPTIONS.find(o=>o.key===e.decision);
        body += `${i+1}. ${who} (${e.time})\n`;
        if(e.quarter) body += `   When: ${e.quarter}${e.clockTime ? ' - ' + e.clockTime : ''}\n`;
        body += `   Question: ${e.question || '-'}\n`;
        if(e.onFieldDecision) body += `   On-field decision: ${e.onFieldDecision}\n`;
        if(e.vuFinding) body += `   VU Finding: ${e.vuFinding}\n`;
        body += `   Outcome: ${outcome ? outcome.label : '-'}\n`;
        body += `   Restart: ${e.restart || '-'}\n`;
        if(e.penalty && e.penalty !== 'none') body += `   Personal penalty: ${e.penalty === 'yellow' ? 'Yellow Card (10 min)' : 'Red Card'}\n`;
        if(e.discretionPenalty) body += `   Possible personal penalty flagged${e.discretionPenaltyNumber ? ` - player #${e.discretionPenaltyNumber}` : ''} (umpire's discretion: green/yellow/red)\n`;
        if(e.type==='team') body += `   Result: Team ${e.keepLose === 'keep' ? 'KEEPS' : e.keepLose === 'lose' ? 'LOSES' : '-'} referral\n`;
        if(e.scriptText) body += `   Read to pitch: "${e.scriptText}"\n`;
        if(e.tookAdvice !== null && e.tookAdvice !== undefined) body += `   Umpire follow-through: ${e.tookAdvice ? 'Took VU advice' : 'Made own decision'}\n`;
        body += `\n`;
      });
    }

    const mailto = `mailto:${encodeURIComponent(state.settings.supervisorEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
  }

  loadSettings();
})();
</script>
</body>
</html>
